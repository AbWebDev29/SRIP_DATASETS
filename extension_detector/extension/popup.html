<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; margin: 0; }
    h3 { margin: 0 0 10px 0; color: #222; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    button:hover { background: #0056b3; }
    #result { margin-top: 12px; padding: 12px; font-weight: bold; border-radius: 6px; text-align: center; font-size: 13px; border: 1px solid #eee; }
    .safe { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
    .unsafe { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  </style>
</head>
<body>
  <h3>Phishing Shield v1.2</h3>
  <button id="scanButton">Scan Current Tab</button>
  <div id="result">Click Scan to verify security...</div>
  <script src="popup.js"></script>
</body>
</html>
